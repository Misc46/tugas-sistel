[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paraphraser"
version = "0.1.0"
description = "Indonesian prose paraphraser/humanizer for LaTeX files"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "sentencepiece",
]

[tool.setuptools]
packages = ["paraphraser"]
